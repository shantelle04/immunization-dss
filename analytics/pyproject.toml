[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "immdss-analytics"
version = "0.1.0"
description = "Data generation, validation and forecasting for the immunization decision support system"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2,<3",
  "pandas>=2,<3",
  "pyyaml>=6,<7",
  "matplotlib>=3.9,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6"]
# Model fitting runs on Colab only (D-14); Colab already ships a compatible TensorFlow.
train = ["statsmodels>=0.14,<0.15", "tensorflow>=2.16,<3"]

[project.scripts]
immdss = "immdss_analytics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
