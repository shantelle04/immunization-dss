# Single source for F-ERD, F-LDS and data_dictionary.md (generated by gen_schema.py via `dev.py diagrams`).
# Phase 3 Django models are written from this file; a test will compare the migrated schema with it.
# Column: [name, PostgreSQL type, flags, source]. Flags: PK, UK, FK:<table>, NULL, and CHECK/DEFAULT notes.
# Source: the column in a run's app/*.csv that the loader maps here ("-" = created by the system).
# Nothing from truth/ or imports/ answer keys has a table (doc 10 section 2).
# Every table also has created_at and updated_at (timestamptz, NOT NULL, set by the application).

apps:
  facilities:
    facility:
      csv: facilities.csv
      purpose: Health facilities (fictional in the synthetic data)
      columns:
        - [id, bigint, PK, "-"]
        - [code, varchar(16), UK, facility_code]
        - [name, varchar(120), "", name]
        - [keph_level, varchar(24), "CHECK dispensary | health_centre | sub_county_hospital", keph_level]
        - [ownership, varchar(24), "", ownership]
        - [county, varchar(60), "", county]
        - [sub_county, varchar(60), "", sub_county]
        - [is_synthetic, boolean, "DEFAULT false", is_synthetic]

  accounts:
    user:
      csv: null
      purpose: Log-in accounts; created by the system administrator only (FR-01, FR-03)
      columns:
        - [id, bigint, PK, "-"]
        - [username, varchar(150), UK, "-"]
        - [password, varchar(128), "Argon2 hash, never plaintext", "-"]
        - [role, varchar(24), "CHECK healthcare_worker | facility_manager | system_admin", "-"]
        - [facility_id, bigint, "FK:facility NULL; CHECK NULL only for system_admin", "-"]
        - [is_active, boolean, "DEFAULT true", "-"]
        - [failed_logins, smallint, "DEFAULT 0 (lockout, NFR-03)", "-"]
        - [locked_until, timestamptz, "NULL", "-"]
        - [last_login, timestamptz, "NULL", "-"]
    auditlog:
      csv: null
      purpose: Who created, changed or read (cross-facility) clinical and stock records (FR-41); no field contents
      columns:
        - [id, bigint, PK, "-"]
        - [at, timestamptz, "DEFAULT now(); INDEX (facility_id, at)", "-"]
        - [user_id, bigint, "FK:user NULL (NULL for a failed login with an unknown username)", "-"]
        - [facility_id, bigint, "FK:facility NULL", "-"]
        - [action, varchar(32), "create | update | read | export | login | login_failed | lockout | logout", "-"]
        - [entity, varchar(48), "", "-"]
        - [entity_id, varchar(64), "", "-"]
        - [cross_facility, boolean, "DEFAULT false (BR-08)", "-"]

  passport:
    antigen:
      csv: antigens.csv
      purpose: Vaccines and their vial presentation
      columns:
        - [id, bigint, PK, "-"]
        - [code, varchar(8), UK, antigen_code]
        - [name, varchar(80), "", name]
        - [doses_per_vial, smallint, "CHECK >= 1", doses_per_vial]
        - [open_vial_policy, boolean, "(BR-07)", open_vial_policy]
    scheduledose:
      csv: schedule.csv
      purpose: KEPI dose rules (BR-01, BR-03); edited by the system administrator (FR-03)
      columns:
        - [id, bigint, PK, "-"]
        - [dose_code, varchar(12), UK, dose_code]
        - [antigen_id, bigint, "FK:antigen", antigen_code]
        - [dose_number, smallint, "", dose_number]
        - [contact, varchar(8), "", contact]
        - [recommended_age_days, integer, "CHECK min <= recommended <= max", recommended_age_days]
        - [min_age_days, integer, "", min_age_days]
        - [max_age_days, integer, "KEPI value in the app (D-24)", max_age_days]
        - [min_interval_days, integer, "", min_interval_days]
    child:
      csv: children.csv
      purpose: Registered children (FR-30); no phone numbers are stored
      columns:
        - [id, uuid, PK, "-"]
        - [system_id, varchar(32), UK, system_id]
        - [source_ref, varchar(16), "UK NULL (loader key)", child_id]
        - [given_name, varchar(80), "", given_name]
        - [family_name, varchar(80), "INDEX (family_name, date_of_birth) for FR-32", family_name]
        - [sex, varchar(1), "CHECK F | M", sex]
        - [date_of_birth, date, "", date_of_birth]
        - [caregiver_name, varchar(120), "", caregiver_name]
        - [registration_facility_id, bigint, "FK:facility", registration_facility_code]
        - [registered_on, date, "", registered_on]
        - [is_synthetic, boolean, "DEFAULT false", is_synthetic]
    immunizationevent:
      csv: immunization_events.csv
      purpose: Doses given (FR-31); antigen_code and dose_number in the CSV are derived from the dose and not stored
      unique: [[child_id, schedule_dose_id]]
      columns:
        - [id, bigint, PK, "-"]
        - [source_ref, varchar(16), "UK NULL (loader key)", event_id]
        - [child_id, uuid, "FK:child", child_id]
        - [schedule_dose_id, bigint, "FK:scheduledose; UK with child_id (BR-06)", dose_code]
        - [given_on, date, "INDEX (facility_id, given_on)", given_on]
        - [facility_id, bigint, "FK:facility", facility_code]
        - [session_id, bigint, "FK:outreachsession NULL", session_id]
        - [lot_id, bigint, "FK:vaccinelot NULL; lot HISTORIC maps to NULL", lot_number]
        - [recorded_by_id, bigint, "FK:user NULL (NULL for loaded history)", "-"]
        - [is_synthetic, boolean, "DEFAULT false", is_synthetic]

  inventory:
    vaccinelot:
      csv: vaccine_lots.csv
      purpose: Vaccine lots
      columns:
        - [id, bigint, PK, "-"]
        - [lot_number, varchar(32), UK, lot_number]
        - [antigen_id, bigint, "FK:antigen", antigen_code]
        - [first_received, date, "", first_received]
        - [expiry, date, "NULL (not in the dataset)", "-"]
    stocktransaction:
      csv: stock_transactions.csv
      purpose: Stock ledger (FR-10); balance is the sum of quantities, never edited (view stock_balance)
      columns:
        - [id, bigint, PK, "-"]
        - [source_ref, varchar(16), "UK NULL (loader key)", transaction_id]
        - [facility_id, bigint, "FK:facility; INDEX (facility_id, antigen_id, occurred_on)", facility_code]
        - [antigen_id, bigint, "FK:antigen", antigen_code]
        - [lot_id, bigint, "FK:vaccinelot NULL", lot_number]
        - [kind, varchar(16), "CHECK opening_balance | receipt | issue | wastage | loss | adjustment", kind]
        - [quantity_doses, integer, "signed; CHECK sign matches kind", quantity_doses]
        - [occurred_on, date, "", date]
        - [session_id, bigint, "FK:outreachsession NULL", session_id]
        - [recorded_by_id, bigint, "FK:user NULL", "-"]
        - [is_synthetic, boolean, "DEFAULT false", is_synthetic]
    stockpolicy:
      csv: null
      purpose: Per facility and antigen replenishment settings for BR-05 (FR-14)
      unique: [[facility_id, antigen_id]]
      columns:
        - [id, bigint, PK, "-"]
        - [facility_id, bigint, "FK:facility", "-"]
        - [antigen_id, bigint, "FK:antigen", "-"]
        - [cycle_weeks, smallint, "DEFAULT 4", "-"]
        - [safety_buffer, "numeric(4,2)", "CHECK >= 0", "-"]
    forecastrun:
      csv: null
      purpose: One run_forecasts execution with its manifest (NFR-11)
      columns:
        - [id, bigint, PK, "-"]
        - [run_at, timestamptz, "", "-"]
        - [git_sha, varchar(40), "", "-"]
        - [data_sha256, varchar(64), "", "-"]
        - [params, jsonb, "", "-"]
        - [metrics, jsonb, "NULL", "-"]
    forecast:
      csv: null
      purpose: Weekly demand forecast per facility and antigen (FR-12)
      unique: [[run_id, facility_id, antigen_id, week_start]]
      columns:
        - [id, bigint, PK, "-"]
        - [run_id, bigint, "FK:forecastrun", "-"]
        - [facility_id, bigint, "FK:facility", "-"]
        - [antigen_id, bigint, "FK:antigen", "-"]
        - [week_start, date, "", "-"]
        - [horizon_week, smallint, "CHECK 1..4", "-"]
        - [yhat, "numeric(10,2)", "", "-"]
        - [lo80, "numeric(10,2)", "", "-"]
        - [hi80, "numeric(10,2)", "", "-"]
        - [model, varchar(16), "seasonal_naive | moving_average | sarima | gru | population", "-"]
    stockalert:
      csv: null
      purpose: Projected stock below the safety minimum (FR-13)
      columns:
        - [id, bigint, PK, "-"]
        - [run_id, bigint, "FK:forecastrun", "-"]
        - [facility_id, bigint, "FK:facility; INDEX (facility_id, status)", "-"]
        - [antigen_id, bigint, "FK:antigen", "-"]
        - [raised_on, date, "", "-"]
        - [projected_breach_week, date, "", "-"]
        - [projected_doses, "numeric(10,2)", "", "-"]
        - [safety_minimum, "numeric(10,2)", "", "-"]
        - [status, varchar(16), "CHECK open | acknowledged | resolved", "-"]
        - [acknowledged_by_id, bigint, "FK:user NULL", "-"]
        - [acknowledged_at, timestamptz, "NULL", "-"]

  scheduling:
    outreachsession:
      csv: sessions.csv
      purpose: Fixed and outreach sessions (FR-23, FR-24)
      columns:
        - [id, bigint, PK, "-"]
        - [source_ref, varchar(16), "UK NULL (loader key)", session_id]
        - [facility_id, bigint, "FK:facility", facility_code]
        - [date, date, "", date]
        - [kind, varchar(8), "CHECK fixed | outreach", kind]
        - [location_name, varchar(120), "", location_name]
        - [capacity, integer, "NULL", "-"]
        - [status, varchar(8), "CHECK planned | held; loaded history = held", "-"]
    sessionplanitem:
      csv: null
      purpose: A child and dose planned for a session, in priority order (FR-23, BR-04)
      unique: [[session_id, child_id, schedule_dose_id]]
      columns:
        - [id, bigint, PK, "-"]
        - [session_id, bigint, "FK:outreachsession", "-"]
        - [child_id, uuid, "FK:child", "-"]
        - [schedule_dose_id, bigint, "FK:scheduledose", "-"]
        - [priority_rank, integer, "", "-"]
    sessionattendance:
      csv: null
      purpose: Attendance at a planned session (FR-24)
      unique: [[session_id, child_id]]
      columns:
        - [id, bigint, PK, "-"]
        - [session_id, bigint, "FK:outreachsession", "-"]
        - [child_id, uuid, "FK:child", "-"]
        - [attended, boolean, "", "-"]

  analytics_api:
    importbatch:
      csv: null
      purpose: A CSV import, dry run or committed (FR-40)
      columns:
        - [id, bigint, PK, "-"]
        - [facility_id, bigint, "FK:facility", "-"]
        - [uploaded_by_id, bigint, "FK:user", "-"]
        - [kind, varchar(16), "CHECK immunizations | stock", "-"]
        - [dry_run, boolean, "", "-"]
        - [rows_total, integer, "", "-"]
        - [rows_rejected, integer, "", "-"]
        - [uploaded_at, timestamptz, "", "-"]
    importrowerror:
      csv: null
      purpose: One rejected row, scored against the planted-defect answer key (NFR-08)
      columns:
        - [id, bigint, PK, "-"]
        - [batch_id, bigint, "FK:importbatch", "-"]
        - [row_index, integer, "", "-"]
        - [defect_code, varchar(32), "", "-"]
        - [message, varchar(200), "", "-"]

views:
  inventory_stock_balance: "SELECT facility_id, antigen_id, SUM(quantity_doses) AS balance FROM inventory_stocktransaction GROUP BY 1, 2 (FR-11; never a writable table)"
